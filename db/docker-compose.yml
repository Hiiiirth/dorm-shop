# 本地开发用 MySQL 8 + Redis
# 启动： docker compose up -d
# 停止： docker compose down
# 清库重来： docker compose down -v
#
# 启动后建议手动导入：
#   docker exec -i wechatseller-mysql mysql -uroot -p123456 < 01-schema.sql
#   docker exec -i wechatseller-mysql mysql -uroot -p123456 dorm_shop < 02-seed.sql

services:
  mysql:
    image: mysql:8.0
    container_name: wechatseller-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: dorm_shop
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wechatseller-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  mysql-data:
  redis-data:
